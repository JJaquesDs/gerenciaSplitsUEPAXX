## ===============================================
# ARQUIVO EXEMPLO DE PROPRIEDADES DA APLICAÇÃO
## =================================================
# Crie um arquivo aqui nesse mesmo diretório com o nome:
# application.properties e muda as variáveis de acordo com suas especificações


spring.application.name=gerenciaSplits
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/SEU_BANCO_DE_DADOS_POSTGRES
spring.datasource.username=postgres(OU_SEU_NOME_DE_USUÁRIO,PADRÃO_É_ESSE)
spring.datasource.password=SUA_SENHA_POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=true
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.hibernate.ddl-auto=update


# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
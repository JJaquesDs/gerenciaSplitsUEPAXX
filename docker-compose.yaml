services:
  frontend:
    build:
      context: ./front-gerencia-splits
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT_HOST}:${FRONTEND_PORT_CONTAINER}"
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - public

  backend:
    build:
      context: ./gerenciaSplits
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT_HOST}:${BACKEND_PORT_CONTAINER}"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      spring.datasource.url: jdbc:postgresql://db:${POSTGRES_PORT_CONTAINER}/${POSTGRES_DB}
      spring.datasource.username: ${POSTGRES_USER}
      spring.datasource.password: ${POSTGRES_PASSWORD}
    networks:
      - public

  db:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT_CONTAINER}"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - public

networks:
  public:

volumes:
  app-db-data: